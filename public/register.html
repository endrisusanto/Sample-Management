<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrasi Akun - Sample Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #090d16 radial-gradient(ellipse at 50% -20%, rgba(59, 130, 246, 0.25), transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .register-card {
      width: 100%;
      max-width: 460px;
      padding: 2.25rem 2rem;
    }
  </style>
</head>
<body>

  <div class="glass-panel register-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
        <i class="fas fa-user-plus fs-2"></i>
      </div>
      <h3 class="fw-bold m-0 text-light">Registrasi Pengguna</h3>
      <p class="text-secondary small">PE Solution P / SEIN-P</p>
    </div>

    <form id="register-form">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Nama Lengkap</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-user"></i></span>
          <input type="text" id="name" class="form-control" required placeholder="Contoh: BUDI SANTOSO" autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Email Perusahaan</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" class="form-control" required placeholder="name@samsung.com">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" class="form-control" required placeholder="Minimal 6 karakter">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Level Akses</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-shield-alt"></i></span>
          <select id="level" class="form-select">
            <option value="member" selected>Member (Standar PIC)</option>
            <option value="super user">Super User (Administrator)</option>
          </select>
        </div>
      </div>

      <!-- PIN Field for Super User -->
      <div class="mb-4 d-none" id="pin-container">
        <label class="form-label text-warning small fw-bold">
          <i class="fas fa-key me-1"></i> Security PIN Super User
        </label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-warning text-warning"><i class="fas fa-lock"></i></span>
          <input type="password" id="pin" class="form-control border-warning" placeholder="Masukkan 6 digit PIN Otorisasi">
        </div>
        <small class="text-secondary" style="font-size: 10.5px;">Wajib memasukkan PIN otorisasi administrator untuk mendaftar sebagai Super User.</small>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center mb-3" id="btn-submit-reg">
        <i class="fas fa-user-check me-1"></i> Daftar Akun
      </button>

      <div class="text-center">
        <span class="text-secondary small">Sudah memiliki akun?</span>
        <a href="/login" class="text-primary small fw-bold ms-1 text-decoration-none">Masuk di sini</a>
      </div>
    </form>
  </div>

  <script type="module">
    const levelSelect = document.getElementById('level');
    const pinContainer = document.getElementById('pin-container');
    const pinInput = document.getElementById('pin');

    levelSelect.addEventListener('change', () => {
      if (levelSelect.value === 'super user') {
        pinContainer.classList.remove('d-none');
        pinInput.required = true;
        pinInput.focus();
      } else {
        pinContainer.classList.add('d-none');
        pinInput.required = false;
        pinInput.value = '';
      }
    });

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const level = levelSelect.value;
      const pin = pinInput.value.trim();

      const btn = document.getElementById('btn-submit-reg');
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Mendaftarkan...';

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, level, pin })
        });
        const data = await res.json();

        if (data.success) {
          const params = new URLSearchParams(window.location.search);
          const target = params.get('redirect') || '/';
          const safeTarget = (target.startsWith('/') && !target.startsWith('//')) ? target : '/';
          alert(`Registrasi Berhasil!\nSelamat datang, ${data.user.name} (${data.user.level.toUpperCase()}).`);
          window.location.href = safeTarget;
        } else {
          alert('Registrasi Gagal: ' + (data.message || 'Terjadi kesalahan saat registrasi.'));
        }
      } catch (err) {
        alert('Gagal mendaftar: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fas fa-user-check me-1"></i> Daftar Akun';
      }
    });
  </script>
</body>
</html>
