<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sample Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background: #090d16 radial-gradient(ellipse at 50% -20%, rgba(59, 130, 246, 0.25), transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      padding: 2.5rem 2rem;
    }
  </style>
</head>
<body>

  <div class="glass-panel login-card">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
        <i class="fas fa-barcode fs-1"></i>
      </div>
      <h3 class="fw-bold m-0 text-light">Sample Tracker</h3>
      <p class="text-secondary small">PE Solution P / SEIN-P</p>
    </div>

    <form id="login-form">
      <div class="mb-3">
        <label class="form-label text-secondary small fw-semibold">Email Perusahaan</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-envelope"></i></span>
          <input type="email" id="email" class="form-control" required placeholder="name@samsung.com" autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label text-secondary small fw-semibold">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-surface border-secondary"><i class="fas fa-lock"></i></span>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
      </div>

      <div id="login-alert" class="alert alert-danger d-none py-2 px-3 small mb-3" style="font-size: 11.5px;"></div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2 fs-6 justify-content-center mb-2" id="btn-login-submit">
        <i class="fas fa-sign-in-alt me-1"></i> Masuk ke Sistem
      </button>

      <button type="button" class="btn btn-surface w-100 py-2 fs-6 justify-content-center mb-3 text-info border-info" id="btn-face-login">
        <i class="fas fa-id-badge me-2 fs-5"></i> Login via Face ID (Wajah)
      </button>

      <div class="text-center">
        <span class="text-secondary small">Belum punya akun / Lupa password?</span>
        <a href="/register" class="text-primary small fw-bold ms-1 text-decoration-none">Daftar Akun Baru</a>
      </div>
    </form>
  </div>

  <!-- Face Recognition Login Modal -->
  <div class="modal fade" id="faceLoginModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" style="max-width: 440px;">
      <div class="modal-content border-info shadow-lg" style="background: var(--bg-surface-elevated, #0f172a); border-radius: 16px;">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title text-info fw-bold fs-6">
            <i class="fas fa-camera me-2"></i> Biometric Face ID Login
          </h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" id="btn-close-face-modal"></button>
        </div>
        <div class="modal-body text-center p-4">
          <p class="text-secondary small mb-3">Posisikan wajah Anda tepat di dalam lingkaran scanner.</p>
          
          <!-- Face Video Frame with Circular Scanner Target -->
          <div class="position-relative mx-auto mb-3" style="width: 240px; height: 240px; border-radius: 50%; overflow: hidden; border: 3px solid var(--accent-blue, #3b82f6); box-shadow: 0 0 25px rgba(59, 130, 246, 0.4);">
            <video id="face-video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);"></video>
            <div class="position-absolute top-50 start-50 translate-middle w-100 h-100" style="border: 2px dashed rgba(255,255,255,0.4); border-radius: 50%; pointer-events: none;"></div>
          </div>

          <div id="face-scan-status" class="alert alert-info py-2 px-3 small mb-3" style="font-size: 11.5px;">
            <i class="fas fa-spinner fa-spin me-1"></i> Mengaktifkan kamera biometrik...
          </div>

          <button type="button" class="btn btn-primary-custom w-100 py-2" id="btn-capture-face-login">
            <i class="fas fa-expand me-1"></i> Pindai Wajah Sekarang
          </button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    import { FaceEngine } from '/js/face-engine.js';
    import { SoundEffects } from '/js/app.js';

    const alertBox = document.getElementById('login-alert');
    const submitBtn = document.getElementById('btn-login-submit');
    const faceLoginModal = new bootstrap.Modal(document.getElementById('faceLoginModal'));
    const faceEngine = new FaceEngine('face-video');
    const faceStatus = document.getElementById('face-scan-status');
    const btnCaptureFace = document.getElementById('btn-capture-face-login');

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('d-none');
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Memverifikasi...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
          window.location.href = '/';
        } else {
          alertBox.textContent = data.message || 'Login gagal: Periksa kembali email dan password Anda.';
          alertBox.classList.remove('d-none');
        }
      } catch (err) {
        alertBox.textContent = 'Gagal melakukan login: ' + err.message;
        alertBox.classList.remove('d-none');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt me-1"></i> Masuk ke Sistem';
      }
    });

    // Face ID Login Flow
    document.getElementById('btn-face-login').addEventListener('click', async () => {
      faceLoginModal.show();
      faceStatus.className = 'alert alert-info py-2 px-3 small mb-3';
      faceStatus.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Mengaktifkan kamera...';

      try {
        await faceEngine.startCamera('user');
        faceStatus.innerHTML = '<i class="fas fa-user-check text-success me-1"></i> Kamera siap. Tatap lurus ke layar dan klik Pindai.';
      } catch (err) {
        faceStatus.className = 'alert alert-danger py-2 px-3 small mb-3';
        faceStatus.innerHTML = '<i class="fas fa-exclamation-triangle me-1"></i> ' + err.message;
      }
    });

    document.getElementById('btn-close-face-modal').addEventListener('click', () => {
      faceEngine.stopCamera();
    });

    btnCaptureFace.addEventListener('click', async () => {
      btnCaptureFace.disabled = true;
      faceStatus.className = 'alert alert-primary py-2 px-3 small mb-3';
      faceStatus.innerHTML = '<i class="fas fa-spinner fa-spin me-1"></i> Memproses biometrik wajah...';

      try {
        const result = faceEngine.extractFaceDescriptor();
        if (!result) throw new Error('Gagal mengekstrak data wajah');

        const res = await fetch('/api/auth/face-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ faceDescriptor: result.descriptor, facePhoto: result.photo })
        });
        const data = await res.json();

        if (data.success) {
          SoundEffects.play('SUCCESS');
          faceStatus.className = 'alert alert-success py-2 px-3 small mb-3';
          faceStatus.innerHTML = `✅ <strong>${data.message}</strong>`;
          setTimeout(() => {
            faceEngine.stopCamera();
            window.location.href = '/';
          }, 1200);
        } else {
          SoundEffects.play('ERROR');
          faceStatus.className = 'alert alert-danger py-2 px-3 small mb-3';
          faceStatus.innerHTML = `❌ ${data.message || 'Wajah tidak dikenali.'}`;
        }
      } catch (err) {
        faceStatus.className = 'alert alert-danger py-2 px-3 small mb-3';
        faceStatus.innerHTML = '❌ ' + err.message;
      } finally {
        btnCaptureFace.disabled = false;
      }
    });
  </script>
</body>
</html>
