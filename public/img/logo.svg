<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Rounded Squircle Background -->
  <rect width="512" height="512" rx="110" fill="#1e40af"/>

  <!-- Inner Flat Container -->
  <rect x="32" y="32" width="448" height="448" rx="88" fill="#2563eb"/>

  <!-- Flat Smartphone Body -->
  <rect x="120" y="72" width="272" height="368" rx="36" fill="#ffffff" stroke="#93c5fd" stroke-width="8"/>

  <!-- Speaker / Camera Notch Pill -->
  <rect x="216" y="96" width="80" height="12" rx="6" fill="#2563eb"/>

  <!-- Barcode Flat Vector Elements (Left) -->
  <g fill="#1e293b" transform="translate(156, 170)">
    <!-- Barcode Bars -->
    <rect x="0" y="0" width="8" height="110" rx="2"/>
    <rect x="14" y="0" width="4" height="110" rx="1"/>
    <rect x="24" y="0" width="12" height="110" rx="2"/>
    <rect x="42" y="0" width="6" height="110" rx="1.5"/>
    <rect x="54" y="0" width="10" height="110" rx="2"/>
    <rect x="70" y="0" width="4" height="110" rx="1"/>
    <rect x="80" y="0" width="8" height="110" rx="2"/>
  </g>

  <!-- QR Code Flat Vector Elements (Right) -->
  <g fill="#1e293b" transform="translate(268, 170)">
    <!-- QR Top-Left Finder -->
    <rect x="0" y="0" width="38" height="38" rx="6" stroke="#1e293b" stroke-width="6" fill="none"/>
    <rect x="10" y="10" width="18" height="18" rx="3" fill="#1e293b"/>

    <!-- QR Top-Right Finder -->
    <rect x="50" y="0" width="38" height="38" rx="6" stroke="#1e293b" stroke-width="6" fill="none"/>
    <rect x="60" y="10" width="18" height="18" rx="3" fill="#1e293b"/>

    <!-- QR Bottom-Left Finder -->
    <rect x="0" y="50" width="38" height="38" rx="6" stroke="#1e293b" stroke-width="6" fill="none"/>
    <rect x="10" y="60" width="18" height="18" rx="3" fill="#1e293b"/>

    <!-- QR Data Matrix Dots -->
    <rect x="50" y="50" width="14" height="14" rx="2" fill="#2563eb"/>
    <rect x="74" y="50" width="14" height="14" rx="2" fill="#1e293b"/>
    <rect x="50" y="74" width="14" height="14" rx="2" fill="#1e293b"/>
    <rect x="74" y="74" width="14" height="14" rx="2" fill="#2563eb"/>
  </g>

  <!-- Scanner Target Laser Beam (Flat) -->
  <line x1="140" y1="225" x2="372" y2="225" stroke="#ef4444" stroke-width="5" stroke-linecap="round"/>

  <!-- Home Indicator Pill -->
  <rect x="216" y="410" width="80" height="8" rx="4" fill="#cbd5e1"/>
</svg>
